VERSION_NAME=1.0.0
GROUP=com.bluesnap
android.useAndroidX=true
android.enableJetifier=true
android.defaults.buildfeatures.buildconfig=true
android.nonTransitiveRClass=false
android.nonFinalResIds=false
# Heap for the Gradle build process (CI, JitPack, local). The 512 MB default runs out of
# memory in Jetifier transforming robolectric jars ("Java heap space") on JDK 17.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
